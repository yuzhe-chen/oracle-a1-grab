name: grab
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
concurrency: {group: grab, cancel-in-progress: false}
permissions: {contents: write, issues: write, actions: write}
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Already found?
        id: chk
        run: if [ -f found.json ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - if: steps.chk.outputs.skip != '1'
        run: pip install -q -r requirements.txt
      - name: Ask Oracle
        if: steps.chk.outputs.skip != '1'
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          IMAGE_ID: ${{ secrets.IMAGE_ID }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: python grab.py
      - name: Record it, tell the owner, stop
        if: steps.chk.outputs.skip != '1' && hashFiles('found.json') != ''
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "grab-bot"; git config user.email "grab-bot@users.noreply.github.com"
          git add found.json && git commit -m "Oracle server created" && git push
          gh issue create --title "Oracle server created" --body "The free Ampere A1 server exists (see found.json). The retry workflow has switched itself off."
          gh workflow disable grab.yml
