name: grab
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
    inputs:
      since: {description: "chain start (epoch seconds)", required: false, default: ""}
concurrency: {group: grab, cancel-in-progress: false}
permissions: {contents: write, issues: write, actions: write}
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Already found?
        id: chk
        run: if [ -f found.json ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - if: steps.chk.outputs.skip != '1'
        run: pip install -q -r requirements.txt
      - name: Ask Oracle
        if: steps.chk.outputs.skip != '1'
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          IMAGE_ID: ${{ secrets.IMAGE_ID }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: python grab.py
      # GitHub runs schedules late or not at all on new repos, so each run starts the next one; the chain stops on success
      # (every 72 hours it starts a fresh chain; the schedule above restarts it if it ever breaks)
      - name: Start the next run
        if: always() && steps.chk.outputs.skip != '1' && hashFiles('found.json') == ''
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          since="${{ github.event.inputs.since }}"; [ -n "$since" ] || since=$(date +%s)
          # after 72 hours a fresh chain starts (owner, 2026-11-26: keep trying until a server exists)
          if [ $(( $(date +%s) - since )) -ge 259200 ]; then since=$(date +%s); echo "72 hours reached, starting a fresh chain"; fi
          gh workflow run grab.yml -f since="$since"; echo "next run started
      - name: Record it, tell the owner, stop
        if: steps.chk.outputs.skip != '1' && hashFiles('found.json') != ''
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "grab-bot"; git config user.email "grab-bot@users.noreply.github.com"
          git add found.json && git commit -m "Oracle server created" && git push
          gh issue create --title "Oracle server created" --body "The free Ampere A1 server exists (see found.json). The retry workflow has switched itself off."
          gh workflow disable grab.yml
